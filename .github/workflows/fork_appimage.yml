name: Fork AppImage

# Builds the fork as an AppImage so it can be tried locally.
# Run manually: gh workflow run fork_appimage.yml --ref custom
# Output: a prerelease tagged `fork-<run number>` with the AppImage attached.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-appimage
  cancel-in-progress: false

jobs:
  appimage:
    name: Build and publish AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      # webrtc-sys does not build with the runner's g++ 11.
      CC: clang
      CXX: clang++
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Install build dependencies
        run: script/linux

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - name: Install cargo-about
        run: command -v cargo-about >/dev/null || cargo install cargo-about --locked --version 0.8.2

      - name: Install appimagetool
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

      - name: Bundle
        run: script/bundle-linux --skip-sentry

      - name: Build AppImage
        run: |
          set -euxo pipefail
          tar -xzf target/release/zed-linux-x86_64.tar.gz
          appdir="$(ls -d zed*.app)"
          mv "$appdir" AppDir
          # Host GPU drivers need a newer libstdc++/libxkbcommon than the Ubuntu 22.04 copies.
          rm -f AppDir/lib/libstdc++.so.6 AppDir/lib/libxkbcommon*.so*
          cp AppDir/share/applications/*.desktop AppDir/zed.desktop
          cp AppDir/share/icons/hicolor/512x512/apps/zed.png AppDir/zed.png
          cat > AppDir/AppRun <<'RUN'
          #!/usr/bin/env bash
          HERE="$(dirname "$(readlink -f "$0")")"
          export ZED_UPDATE_EXPLANATION="Updates are disabled in the fork AppImage."
          # Share Zed's default data/config paths unless the user requests isolation.
          if [[ -n "${ZED_FORK_USER_DATA_DIR:-}" ]]; then
            exec "$HERE/libexec/zed-editor" --user-data-dir "$ZED_FORK_USER_DATA_DIR" "$@"
          fi
          exec "$HERE/libexec/zed-editor" "$@"
          RUN
          chmod +x AppDir/AppRun
          version="$(script/get-crate-version zed)"
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool AppDir "zed-fork_${version}_${GITHUB_RUN_NUMBER}_x86_64.AppImage"
          sha256sum zed-fork_*.AppImage > SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zed-fork-appimage
          path: |
            zed-fork_*.AppImage
            SHA256SUMS.txt
          compression-level: 0
          retention-days: 7

      - name: Publish release
        run: |
          tag="fork-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" zed-fork_*.AppImage SHA256SUMS.txt \
            --target "$GITHUB_SHA" --prerelease \
            --title "Zed fork ${GITHUB_RUN_NUMBER} (${GITHUB_SHA:0:7})" \
            --notes "Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA}"
