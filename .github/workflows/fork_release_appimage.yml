name: Fork Release AppImage

# Builds the fork's stable channel as an AppImage that shares data with the installed Zed.
# Run manually: gh workflow run fork_release_appimage.yml --ref custom
# Output: a prerelease tagged `fork-<run number>` with the AppImage attached.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-appimage
  cancel-in-progress: false

jobs:
  appimage:
    name: Build and publish AppImage
    runs-on: [self-hosted, linux, x64, zed-fork]
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      HOME: /root
      # webrtc-sys does not build with the runner's g++ 11.
      CC: clang
      CXX: clang++
      # Fork builds trade a little runtime speed for much shorter CI: no LTO,
      # parallel codegen, no debuginfo, incremental, and no remote server.
      ZED_FORK_FAST: "1"
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_PROFILE_RELEASE_INCREMENTAL: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Configure persistent Rust cache
        run: |
          mkdir -p "$HOME/.cache/zed-fork-target"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "CARGO_TARGET_DIR=$HOME/.cache/zed-fork-target" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_JOBS=12" >> "$GITHUB_ENV"

      - name: Install cargo-about
        run: command -v cargo-about >/dev/null || cargo install cargo-about --locked --version 0.8.2

      - name: Install appimagetool
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

      - name: Bundle
        run: script/bundle-linux --skip-sentry

      - name: Build AppImage
        run: |
          set -euxo pipefail
          tar -xzf "$CARGO_TARGET_DIR/release/zed-linux-x86_64.tar.gz"
          appdir="$(ls -d zed*.app)"
          mv "$appdir" AppDir
          # Host GPU drivers need a newer libstdc++/libxkbcommon than the Ubuntu 22.04 copies.
          rm -f AppDir/lib/libstdc++.so.6 AppDir/lib/libxkbcommon*.so*
          cp AppDir/share/applications/*.desktop AppDir/zed.desktop
          cp script/fork-icon/zed-fork-512.png AppDir/zed.png
          cp script/fork-icon/zed-fork-512.png AppDir/share/icons/hicolor/512x512/apps/zed.png
          cat > AppDir/AppRun <<'RUN'
          #!/usr/bin/env bash
          HERE="$(dirname "$(readlink -f "$0")")"
          export ZED_UPDATE_EXPLANATION="Updates are disabled in the fork AppImage."
          # Share Zed's default data/config paths unless the user requests isolation.
          if [[ -n "${ZED_FORK_USER_DATA_DIR:-}" ]]; then
            exec "$HERE/libexec/zed-editor" --user-data-dir "$ZED_FORK_USER_DATA_DIR" "$@"
          fi
          ZED_FLATPAK_HOME="$HOME/.var/app/dev.zed.Zed"
          if [[ -d "$ZED_FLATPAK_HOME/config/zed" ]]; then
            export FLATPAK_XDG_CONFIG_HOME="$ZED_FLATPAK_HOME/config"
            export FLATPAK_XDG_DATA_HOME="$ZED_FLATPAK_HOME/data"
            export FLATPAK_XDG_CACHE_HOME="$ZED_FLATPAK_HOME/cache"
            export FLATPAK_XDG_STATE_HOME="$ZED_FLATPAK_HOME/.local/state"
          fi
          exec "$HERE/libexec/zed-editor" "$@"
          RUN
          chmod +x AppDir/AppRun
          version="$(script/get-crate-version zed)"
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool AppDir "zed-fork_${version}_${GITHUB_RUN_NUMBER}_x86_64.AppImage"
          sha256sum zed-fork_*.AppImage > SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zed-fork-appimage
          path: |
            zed-fork_*.AppImage
            SHA256SUMS.txt
          compression-level: 0
          retention-days: 7

      - name: Publish release
        run: |
          tag="fork-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" zed-fork_*.AppImage SHA256SUMS.txt \
            --target "$GITHUB_SHA" --prerelease \
            --title "Zed fork ${GITHUB_RUN_NUMBER} (${GITHUB_SHA:0:7})" \
            --notes "Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA}"
